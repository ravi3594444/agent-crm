# yaml-language-server: $schema=https://storage.googleapis.com/coderabbit_public_assets/schema.v2.json
reviews:
  pre_merge_checks:
    # Apagado a propósito, no ignorado. En este repo los docstrings SON los
    # documentos de diseño: varios cientos de palabras en app/solicitudes.py
    # sobre por qué un registro tiene que ser durable, o en app/inventario.py
    # sobre por qué la confianza en un conteo vence. Un porcentaje no puede
    # expresar ese criterio, que es «la función que toma una decisión explica
    # la decisión»: el mismo diff trae legítimamente `_sello`, `_zona`,
    # `_horas` y `_linea_grupos`, one-liners cuyo nombre ES la documentación.
    #
    # Rellenar ese conjunto con docstrings de una línea para mover un número
    # le enseña al que lea después que acá los docstrings son decoración, y
    # entonces deja de leer los que importan. Y bajar el umbral hasta que hoy
    # pase sólo aplaza el problema: el próximo PR que toque más helpers que
    # decisiones lo vuelve a poner en rojo.
    #
    # Un check que falla en TODOS los PR para siempre es peor que no tenerlo,
    # porque entrena a todo el mundo a pasar por encima de las marcas rojas.
    # Los docstrings que llevan una decisión se revisan leyéndolos, no
    # contándolos.
    docstrings:
      mode: "off"
