name: CI

# Los tests no necesitan Redis, ni ERPNext, ni credenciales de Meta, ni
# tokens de LLM: son 100% offline y tardan ~2 segundos. Por eso pueden correr
# en cada push sin fricción.

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: plus-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plus-agent/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Formato
        run: ruff format --check app tests

      - name: Tests
        run: pytest -q

      - name: La imagen buildea
        run: docker build -t plus-agent:ci .

      - name: El contenedor arranca y sirve /health
        # Prueba lo que ningún test unitario puede: que las variables de
        # entorno obligatorias estén todas declaradas y que uvicorn levante.
        run: |
          docker run -d --name agente-ci -p 8080:8080 \
            -e ERPNEXT_URL=http://erpnext.invalid \
            -e ERPNEXT_API_KEY=k -e ERPNEXT_API_SECRET=s \
            -e ERPNEXT_POLICY_API_KEY=pk -e ERPNEXT_POLICY_API_SECRET=ps \
            -e META_APP_SECRET=x -e META_VERIFY_TOKEN=y \
            -e REDIS_URL=redis://redis.invalid:6379/0 \
            -e WHATSAPP_PHONE_NUMBER_ID=1 -e WHATSAPP_TOKEN=t \
            -e ANTHROPIC_API_KEY=sk-noop \
            plus-agent:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/health; then echo "OK"; exit 0; fi
            sleep 1
          done
          echo "el contenedor no respondió /health"
          docker logs agente-ci
          exit 1
