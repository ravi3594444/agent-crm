name: CI

# Los tests no llaman a ERPNext, ni a Meta, ni a ningún LLM: eso lo fija
# tests/conftest.py con valores de prueba y dobles en memoria.
#
# SÍ necesitan un Redis Stack, y decir que no lo necesitaban costó todo el
# valor de este job. app/graph.py construye el checkpointer y llama a setup()
# AL IMPORTAR, y eso crea índices de RediSearch contra un servidor real. Sin
# Redis, dos módulos de test explotan al colectarse — y pytest aborta toda la
# corrida con "Interrupted: 2 errors during collection". CI quedaba en rojo
# habiendo corrido CERO tests, y el rojo se leía como "un test falla".
#
# Por eso el job de tests levanta su propio Redis Stack (RedisJSON +
# RediSearch, no un Redis pelado) en una base dedicada, y pone
# REDIS_OBLIGATORIO para que "Redis no está" sea una FALLA y no un skip
# silencioso: un skip es exactamente cómo la suite deja de ser la suite.

on:
  push:
    branches: ["**"]
  pull_request:

defaults:
  run:
    working-directory: plus-agent

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        # RedisJSON + RediSearch. langgraph-checkpoint-redis needs both, and a
        # plain `redis:7` image fails at import with a module-not-loaded error.
        image: redis/redis-stack-server:7.4.0-v1
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      # Its own database, so nothing in the suite can be confused by another
      # job's leftovers, and REDIS_OBLIGATORIO turns "no Redis" into a failure.
      REDIS_URL: redis://localhost:6379/15
      REDIS_OBLIGATORIO: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: plus-agent/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests

      - name: Tests
        # -rs lists every skip in the log. A suite whose coverage quietly
        # shrinks by one skipped test is the failure this job just had.
        run: pytest -q -rs

      - name: La imagen buildea
        run: docker build -t plus-agent:ci .

      - name: El contenedor arranca y sirve /health
        # Prueba lo que ningún test unitario puede: que TODAS las variables
        # que la app exige al importar estén declaradas, que el checkpointer
        # arranque contra un Redis Stack real y que uvicorn levante en 8081.
        # DASHSCOPE_API_KEY: app/modelos.py exige que exista al construir los
        # modelos Qwen (al importar); no se llama a DashScope en el arranque.
        run: |
          docker network create ci
          docker run -d --name redis-ci --network ci redis/redis-stack-server:7.4.0-v1
          for i in $(seq 1 30); do
            docker exec redis-ci redis-cli ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker run -d --name agente-ci --network ci -p 8081:8081 \
            -e ERPNEXT_URL=http://erpnext.invalid \
            -e ERPNEXT_API_KEY=k -e ERPNEXT_API_SECRET=s \
            -e ERPNEXT_MANAGER_API_KEY=mk -e ERPNEXT_MANAGER_API_SECRET=ms \
            -e ERPNEXT_POLICY_API_KEY=pk -e ERPNEXT_POLICY_API_SECRET=ps \
            -e META_APP_SECRET=x -e META_VERIFY_TOKEN=y \
            -e REDIS_URL=redis://redis-ci:6379/0 \
            -e WHATSAPP_PHONE_NUMBER_ID=1 -e WHATSAPP_TOKEN=t \
            -e DASHSCOPE_API_KEY=noop \
            plus-agent:ci
          for i in $(seq 1 30); do
            if curl -fsS localhost:8081/health; then echo; echo "OK"; exit 0; fi
            sleep 1
          done
          echo "el contenedor no respondió /health"
          docker logs agente-ci
          exit 1
