# Configuración de herramientas. La de pytest sigue en pytest.ini (pytest la
# prefiere sobre pyproject.toml cuando existen las dos, así que no se duplica).

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "RUF",
]
ignore = [
    "SIM105",  # try/except/pass -> contextlib.suppress: puro estilo; no vale tocar el código base por esto
    "E501",    # el largo de línea lo maneja el formatter
    "B008",    # Depends()/Field() en defaults es el idioma de FastAPI
    "RUF001",  # comillas y guiones unicode: los docstrings están en español
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Un fixture importado y usado como argumento del test es una "redefinición" para ruff.
"tests/*" = ["F811"]
# Los tests importan la app después de setear el entorno: el import no puede
# estar arriba del todo (ver tests/conftest.py).
"tests/*.py" = ["E402"]
# `deploy/` ESTABA EXCLUIDO de ruff hasta que aparecieron los dos scripts de
# datos reales (docs/prompt-datos-reales.md). Ahora se lintea, salvo una línea:
#
# `deploy/seed_dairy.py` tiene un `# noqa: E402` que quedó viejo —ruff aprendió
# a permitir un import después de un `sys.path.insert`, así que ya no hace
# falta— y esta semana ese archivo es de otra sesión. Trece caracteres de
# limpieza no valen un conflicto de merge en el archivo que esa sesión está
# editando. BORRAR ESTA LÍNEA cuando esa sesión cierre: `ruff check deploy` lo
# vuelve a decir solo.
"deploy/seed_dairy.py" = ["RUF100"]
