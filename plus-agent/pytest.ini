[pytest]
testpaths = tests
markers =
    idioma(lengua): este archivo afirma texto en ESE idioma, y lo declara en vez
        de heredarlo del entorno. Ver el fixture _idioma_declarado en
        tests/conftest.py y el issue #15.
    locale(codigo): este archivo afirma MONTOS con esa forma de número, y la
        declara en vez de heredarla del entorno. Ver el fixture
        _locale_declarado en tests/conftest.py.
