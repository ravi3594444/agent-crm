# @casys/mcp-erpnext junto al agente. NO se levanta solo: se agrega a mano al
# proyecto `plus-agent` con `-f`, porque es un servicio de terceros y tiene que
# verse que alguien lo puso.
#
#   cd /srv/agent-crm/plus-agent
#   docker compose -f docker-compose.yml -f ../deploy/mcp-erpnext.compose.yml up -d
#
# LA PREGUNTA QUE IMPORTA NO ES QUÉ HERRAMIENTAS CARGA, ES CON QUÉ USUARIO.
# Este servidor actúa con UNA credencial de ERPNext y no tiene permisos por
# herramienta: lo que puede hacer lo decide el usuario de `ERPNEXT_API_KEY` de
# acá abajo, y nada más. Con las 125 herramientas cargadas eso incluye
# `erpnext_doc_submit`, `erpnext_doc_cancel`, `erpnext_doc_delete` y
# `erpnext_doc_create` —genérico sobre cualquier doctype, o sea que alcanza
# `Item Price`—. Elegí ese usuario a conciencia; es el único control que hay.
services:
  mcp-erpnext:
    image: node:22-alpine
    container_name: mcp-erpnext
    restart: unless-stopped
    command: >
      npx -y @casys/mcp-erpnext --http --port=3012 --hostname=0.0.0.0
    environment:
      # El MISMO `frontend:8080` que usa el agente, y por el mismo motivo:
      # apuntar a `backend:8000` devuelve «404 backend does not exist», porque
      # Frappe resuelve el sitio por el header Host. Ver CLAUDE.md.
      ERPNEXT_URL: http://frontend:8080
      ERPNEXT_API_KEY: ${MCP_ERPNEXT_API_KEY:?falta MCP_ERPNEXT_API_KEY}
      ERPNEXT_API_SECRET: ${MCP_ERPNEXT_API_SECRET:?falta MCP_ERPNEXT_API_SECRET}
      # El token con el que ESTE servidor autentica a quien lo llama. Tiene que
      # coincidir con `MCP_EXTERNO_TOKEN_ERPNEXT` del agente.
      MCP_AUTH_TOKEN: ${MCP_ERPNEXT_AUTH_TOKEN:?falta MCP_ERPNEXT_AUTH_TOKEN}
      # Deny-by-default: sin esto `erpnext_method_call` no ejecuta ningún método
      # de Frappe. Dejarlo sin definir es lo correcto.
    networks:
      - frappe_docker_default
    # SIN `ports:`. Lo alcanza el agente por la red de docker y nadie más; una
    # publicación al host lo dejaría a un firewall mal puesto de distancia de
    # ser internet con una sola credencial adentro.
    expose:
      - "3012"
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:3012/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  # La red REAL se llama `frappe_docker_default`, no `erpnext_default`:
  # `docker compose config` le horneó el nombre del directorio de origen. Es una
  # de las trampas de CLAUDE.md y cuesta media hora cada vez que se olvida.
  frappe_docker_default:
    external: true
